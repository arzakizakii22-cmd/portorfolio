<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Profesional</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1f4068, #162447, #1a1a2e);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 0;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #e43f5a;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 400;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #e43f5a;
        }

        .main-container {
            max-width: 1100px;
            width: 100%;
            margin: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
            padding: 40px 0;
        }

        .hero-content h1 {
            font-size: 3rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .hero-content h1 span {
            color: #e43f5a;
        }

        .hero-content p {
            font-size: 1rem;
            color: #b0c4de;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn-group {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .btn-primary {
            background-color: #e43f5a;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(228, 63, 90, 0.4);
        }

        .btn-primary:hover {
            background-color: #c72c41;
            transform: translateY(-3px);
        }

        .btn-secondary {
            background: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
        }

        .btn-secondary:hover {
            background: #ffffff;
            color: #1a1a2e;
            transform: translateY(-3px);
        }

        /* Kartu Glassmorphism di sebelah kanan */
        .card-glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .card-glass img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #e43f5a;
            margin-bottom: 20px;
        }

        .card-glass h3 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .card-glass p {
            color: #b0c4de;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-icons a {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: background 0.3s ease;
        }

        .social-icons a:hover {
            background: #e43f5a;
        }

        footer {
            text-align: center;
            padding: 20px 0;
            color: #b0c4de;
            font-size: 0.85rem;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
        }

        /* Responsif untuk layar kecil */
        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .btn-group {
                justify-content: center;
            }
            .social-icons {
                justify-content: center;
            }
            header nav {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">Portofolio.</div>
        <nav>
            <a href="#">Beranda</a>
            <a href="#">Tentang</a>
            <a href="#">Proyek</a>
            <a href="#">Kontak</a>
        </nav>
    </header>

    <!-- Konten Utama -->
    <div class="main-container">
        <div class="hero-content">
            <h1>Halo, Saya <br><span>Nur Akmalul Arzaki</span></h1>
            <p>Seorang Web Developer & Desainer UI/UX yang bersemangat menciptakan pengalaman digital yang menarik, modern, dan fungsional.</p>
            <div class="btn-group">
                <a href="#" class="btn btn-primary">Hubungi Saya</a>
                <a href="#" class="btn btn-secondary">Lihat Portofolio</a>
            </div>
        </div>

        <!-- Kartu Profil -->
        <div class="card-glass">
            <a href="foto saya.jpeg"><img src="foto saya.jpeg" alt="foto-saya" border="0"></a>
            <p>Frontend Developer</p>
            <div class="social-icons">
                
                <a href="#"><i class="fab fa-linkedin-in"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Portofolio Anda.sepenuh hati.</p>
    </footer>

</body>
</html>
